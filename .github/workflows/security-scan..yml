name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  #schedule:
  # Run daily at 2 AM UTC
  #- cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-scan-repo:
    name: Trivy - Repository Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Trivy vulnerability scanner (repo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          output: trivy-repo-results.txt
          severity: "CRITICAL,HIGH"

      - name: Publish Trivy Output to Summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -s trivy-repo-results.txt ]]; then
            {
              echo "### Repo Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat trivy-repo-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi

  
  trivy-scan-docker:
    name: Trivy - Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          tags: test-image:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "test-image:${{ github.sha }}"
          output: "trivy-image-results.txt"
          severity: "CRITICAL,HIGH"

      - name: Publish Trivy Output to Summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -s trivy-image-results.txt ]]; then
            {
              echo "### Image Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat trivy-image-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi
  
