# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: draftsman

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -w -s
      - -X main.Version={{ .Version }}
      - -X main.BuildDate={{ .Date }}
      - -X main.Commit={{ .Commit }}
    main: cmd/draftsman/main.go

archives:
  - formats: [tar.gz]
    # tar.gz on every OS, including Windows (whose bundled bsdtar extracts
    # it fine) — the composite Action (ticket 13) downloads and extracts
    # this same archive on every runner OS with one `tar` command, no
    # zip-specific extraction path needed.
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  # A fixed, version-independent name so the Action can reference it
  # without templating the version into the filename twice.
  name_template: "checksums.txt"

release:
  mode: keep-existing
